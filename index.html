<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashen Dominion</title>
    <link rel="stylesheet" href="styles/main.css">
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js"
        }
    }
    </script>
</head>
<body>
    <div id="loading-screen" class="active">
        <div class="logo-container">
            <svg id="game-logo" viewBox="0 0 240 110" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <filter id="logo-glow">
                        <feGaussianBlur stdDeviation="3" result="blur"/>
                        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>
                    <linearGradient id="logo-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%"   stop-color="#8e44ad"/>
                        <stop offset="50%"  stop-color="#4aa9a6"/>
                        <stop offset="100%" stop-color="#8e44ad"/>
                    </linearGradient>
                </defs>
                <!-- Outer hexagon frame -->
                <polygon points="60,15 180,15 210,55 180,95 60,95 30,55"
                         fill="none" stroke="url(#logo-stroke)" stroke-width="1.5"
                         filter="url(#logo-glow)" opacity="0.9"/>
                <!-- Inner accent lines -->
                <line x1="30" y1="55" x2="210" y2="55" stroke="rgba(74,169,166,0.25)" stroke-width="1"/>
                <!-- Title text -->
                <text x="120" y="46" font-family="Arial" font-size="13" font-weight="bold"
                      fill="#ecf0f1" text-anchor="middle" letter-spacing="3" filter="url(#logo-glow)">ASHEN DOMINION</text>
                <!-- Sub-text -->
                <text x="120" y="67" font-family="Arial" font-size="7"
                      fill="rgba(142,68,173,0.9)" text-anchor="middle" letter-spacing="6">REQUIEMPORIUM</text>
            </svg>
        </div>
        <div class="loading-bar">
            <div class="loading-progress"></div>
        </div>
    </div>

    <div id="splash-screen" class="hidden">
        <div class="splash-container">
            <h1>Ashen Dominion</h1>
            <div class="menu-buttons">
                <button id="new-game-btn" class="menu-btn">New Game</button>
                <button id="load-game-btn" class="menu-btn">Load Game</button>
                <button id="options-btn" class="menu-btn">Options</button>
            </div>
        </div>
    </div>

    <div id="new-game-screen" class="hidden">
        <div class="screen-container">
            <h2>Create Character</h2>
            <div class="character-creation">
                <div class="character-preview">
                    <div id="character-model"></div>
                </div>
                <div class="character-options">
                    <div class="option-group">
                        <label>Name:</label>
                        <input type="text" id="character-name" placeholder="Enter name...">
                    </div>
                    <div class="option-group">
                        <label>Seed:</label>
                        <input type="text" id="world-seed" placeholder="Random seed">
                        <button id="random-seed-btn">Random</button>
                    </div>
                    <div class="option-group">
                        <label>Appearance:</label>
                        <div class="appearance-controls">
                            <div>
                                <span>Character Type:</span>
                                <select id="character-type">
                                    <option value="warrior">Warrior</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="option-group">
                        <label>Starting Stats:</label>
                        <div class="stats-allocation">
                            <div>
                                <span>Strength:</span>
                                <span>10</span>
                            </div>
                            <div>
                                <span>Dexterity:</span>
                                <span>8</span>
                            </div>
                            <div>
                                <span>Intelligence:</span>
                                <span>7</span>
                            </div>
                            <div>
                                <span>Vitality:</span>
                                <span>10</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="creation-actions">
                <button id="back-to-menu-btn" class="menu-btn">Back</button>
                <button id="start-game-btn" class="menu-btn primary">Start Game</button>
            </div>
        </div>
    </div>

    <div id="load-game-screen" class="hidden">
        <div class="screen-container">
            <h2>Load Game</h2>
            <div class="saved-games-list">
                <!-- Saved games will be populated here -->
            </div>
            <div class="load-actions">
                <button id="back-from-load-btn" class="menu-btn">Back</button>
                <button id="load-selected-btn" class="menu-btn primary">Load Selected</button>
            </div>
        </div>
    </div>

    <div id="options-screen" class="hidden">
        <div class="screen-container">
            <h2>Options</h2>
            <div class="options-controls">
                <div class="option-slider">
                    <label>Music Volume:</label>
                    <input type="range" id="music-volume" min="0" max="100" value="70">
                    <span class="slider-value">70%</span>
                </div>
                <div class="option-slider">
                    <label>Sound Effects:</label>
                    <input type="range" id="sfx-volume" min="0" max="100" value="80">
                    <span class="slider-value">80%</span>
                </div>
                <div class="option-toggle">
                    <label>Show FPS:</label>
                    <input type="checkbox" id="show-fps">
                </div>
                <div class="option-toggle">
                    <label>Enable Weather Effects:</label>
                    <input type="checkbox" id="enable-weather" checked>
                </div>
            </div>
            <div class="options-actions">
                <button id="back-from-options-btn" class="menu-btn">Back</button>
                <button id="save-options-btn" class="menu-btn primary">Save Options</button>
            </div>
        </div>
    </div>

    <div id="game-container" class="hidden">
        <canvas id="game-canvas"></canvas>
        
        <div id="ui-container">
            <!-- Game HUD elements -->
            <div id="player-stats" class="ui-panel">
                <div class="health-bar">
                    <div class="health-label">Health</div>
                    <div class="health-value"></div>
                </div>
                <div class="energy-bar">
                    <div class="energy-label">Energy</div>
                    <div class="energy-value"></div>
                </div>
            </div>
            
            <div id="mini-map" class="ui-panel">
                <!-- Mini-map will be rendered here -->
            </div>
            
            <div id="action-bar" class="ui-panel">
                <!-- Quick actions and hotkeys -->
            </div>
            
            <div id="time-display" class="ui-panel">
                <div class="day-cycle"></div>
                <div class="time-text"></div>
                <div class="season-indicator"></div>
            </div>
            
            <div id="notification-area">
                <!-- Notifications and alerts will appear here -->
            </div>
        </div>
        
        <!-- Modal interfaces -->
        <div id="inventory-modal" class="game-modal hidden">
            <div class="modal-header">
                <h3>Inventory</h3>
                <button class="close-modal-btn">×</button>
            </div>
            <div class="modal-content">
                <div class="inventory-container">
                    <div class="equipment-slots">
                        <!-- Equipment slots will be generated dynamically -->
                    </div>
                    <div class="inventory-grid">
                        <!-- Inventory grid will be generated dynamically -->
                    </div>
                </div>
                <div class="character-stats">
                    <!-- Character stats will be displayed here -->
                </div>
            </div>
        </div>
        
        <div id="dialogue-modal" class="game-modal hidden">
            <div class="modal-content">
                <div class="npc-portrait"></div>
                <div class="dialogue-content">
                    <div class="npc-name"></div>
                    <div class="dialogue-text"></div>
                    <div class="dialogue-options">
                        <!-- Dialogue options will be generated dynamically -->
                    </div>
                </div>
            </div>
        </div>
        
        <div id="quest-modal" class="game-modal hidden">
            <div class="modal-header">
                <h3>Quests</h3>
                <button class="close-modal-btn">×</button>
            </div>
            <div class="modal-content">
                <div class="quest-list">
                    <!-- Active quests will be listed here -->
                </div>
                <div class="quest-details">
                    <!-- Details of selected quest will be shown here -->
                </div>
            </div>
        </div>
        
        <div id="trading-modal" class="game-modal hidden">
            <div class="modal-header">
                <h3>Trading</h3>
                <button class="close-modal-btn">×</button>
            </div>
            <div class="modal-content">
                <div class="trading-container">
                    <div class="player-inventory trading-section">
                        <h4>Your Items</h4>
                        <div class="inventory-grid">
                            <!-- Player items will be displayed here -->
                        </div>
                    </div>
                    <div class="trading-controls">
                        <div class="trade-values">
                            <div class="player-value">0</div>
                            <div class="merchant-value">0</div>
                        </div>
                        <button class="trade-btn">Trade</button>
                    </div>
                    <div class="merchant-inventory trading-section">
                        <h4>Merchant Items</h4>
                        <div class="inventory-grid">
                            <!-- Merchant items will be displayed here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Dev tools interface -->
        <div id="dev-tools" class="hidden">
            <div class="dev-tools-header">
                <h3>Developer Tools</h3>
                <button id="toggle-dev-tools-btn">Hide</button>
            </div>
            <div class="dev-tools-tabs">
                <button class="dev-tab-btn active" data-tab="entity-inspector">Entities</button>
                <button class="dev-tab-btn" data-tab="world-editor">World</button>
                <button class="dev-tab-btn" data-tab="story-debug">Story</button>
                <button class="dev-tab-btn" data-tab="system-debug">Systems</button>
            </div>
            <div class="dev-tools-content">
                <div id="entity-inspector" class="dev-tab-content active">
                    <div class="entity-list">
                        <!-- List of entities in the game world -->
                    </div>
                    <div class="entity-details">
                        <!-- Selected entity details -->
                    </div>
                </div>
                <div id="world-editor" class="dev-tab-content">
                    <!-- World editing tools -->
                </div>
                <div id="story-debug" class="dev-tab-content">
                    <!-- Story and quest debugging -->
                </div>
                <div id="system-debug" class="dev-tab-content">
                    <!-- System monitoring and controls -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/seedrandom@3.0.5/seedrandom.min.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
